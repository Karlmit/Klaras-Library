name: Release

on:
  push:
    tags: ['v*']
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the GitHub Release
      packages: write   # push to ghcr.io
    steps:
      # The Dockerfile builds the SPA in its own stage, so no Node setup is
      # needed here: `docker build .` produces the whole image.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # needed for the changelog

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Unraid decides an update is available by comparing the digest it has
      # against the digest the registry serves for the same tag, so :latest must
      # be republished on every release. The semver tags let you pin a version.
      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
          labels: |
            org.opencontainers.image.title=Klaras Library
            org.opencontainers.image.description=Fast self-hosted ebook library with Kobo sync
            org.opencontainers.image.licenses=AGPL-3.0-or-later

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          # amd64 for Unraid, arm64 so it also runs on a Pi or an ARM NAS.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            REVISION=${{ github.sha }}
            CREATED=${{ github.event.repository.updated_at }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Publish the GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: docker-compose.example.yml
          body: |
            ## Container image

            ```
            ghcr.io/${{ github.repository_owner }}/klaras-library:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/klaras-library:latest
            ```

            Built for `linux/amd64` and `linux/arm64`.

            ## Quick start

            Download `docker-compose.example.yml` from the assets below, or copy it
            from the README, edit the four settings at the top, then:

            ```bash
            docker compose up -d
            ```

            See the README for importing an existing Calibre library and for the
            two reverse-proxy settings Kobo sync needs.
